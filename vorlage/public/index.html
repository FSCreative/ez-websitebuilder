<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neue Website</title>
<link rel="stylesheet" href="/builder/builder.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="siteNav"></div>

<header class="hero" data-ez-hero>
  <div class="hero-bild" data-ez-hero-bild data-ez-bg="hero.bild" style="background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1800')"></div>
  <div class="hero-text">
    <h1 data-ez="hero.titel">Willkommen</h1>
    <p data-ez="hero.text">Ein Satz, der sagt, worum es hier geht.</p>
    <a class="ez-knopf" data-ez="hero.knopf" href="/#kontakt">Kontakt</a>
  </div>
</header>

<section id="ueber" class="abschnitt">
  <h2 data-ez="ueber.titel">Über uns</h2>
  <p data-ez="ueber.text">Hier steht ein Text – im Editor anklicken und losschreiben.</p>
</section>

<section id="kontakt" class="abschnitt">
  <h2 data-ez="kontakt.titel">Kontakt</h2>
  <p data-ez="kontakt.text">Schreib uns eine Nachricht.</p>
</section>

<footer id="siteFoot"></footer>
<script src="/js/site.js"></script>
<script src="/builder/runtime.js"></script>
</body>
</html>
